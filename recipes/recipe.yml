# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: mio-aurora-omega
description: "Aurora KDE/Wayland fanless daily driver — Ryzen 5 5625U Vega 7, BIOS 10 W, Btrfs/Snapper, Bitwarden, zero friction"

# Aurora stable segue il ramo stabile corrente.
# In agosto 2026 il ramo stable e' basato su Fedora 44.
base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable

modules:
  # --------------------------------------------------------------------------
  # 1. FILE DI SISTEMA
  #
  # Il contenuto di ./system/ viene copiato nella root dell'immagine.
  # --------------------------------------------------------------------------
  - type: files
    files:
      - source: system
        destination: /

  # --------------------------------------------------------------------------
  # 2. PACCHETTI RPM EXTRA
  #
  # Sono stati rimossi i pacchetti gia' normalmente forniti da Aurora-DX.
  # --------------------------------------------------------------------------
  - type: dnf
    repos:
      copr:
        - ublue-os/staging
        - atim/starship
        - aptupdate/bitwarden-cli

    # Riduce le dipendenze opzionali.
    install-weak-deps: false

    install:
      packages:
        # --------------------------------------------------------------------
        # Utility desktop realmente extra
        # --------------------------------------------------------------------
        - dolphin-plugins
        - kfind

        # --------------------------------------------------------------------
        # Utility terminale, rete e amministrazione
        # --------------------------------------------------------------------
        - btop
        - ethtool
        - lftp
        - nmap-ncat

        # --------------------------------------------------------------------
        # Btrfs e Snapper
        #
        # btrfs-assistant e' la GUI per Btrfs/Snapper.
        # snapper-gui non viene installato perche' non e' un pacchetto Fedora
        # standard affidabile per questa immagine.
        # --------------------------------------------------------------------
        - snapper
        - btrfs-assistant

        # --------------------------------------------------------------------
        # Hardware e diagnostica
        #
        # Il Ryzen 5 5625U monta Radeon Vega 7, non Radeon 680M.
        # Il limite energetico di 10 W e' gia' configurato nel BIOS.
        # --------------------------------------------------------------------
        - powertop

        # --------------------------------------------------------------------
        # Strumenti CLI moderni
        # --------------------------------------------------------------------
        - bitwarden-cli
        - rclone
        - starship
        - micro
        - fastfetch
        - fzf
        - zoxide
        - bat
        - eza
        - ripgrep
        - fd-find
        - jq
        - yq

    remove:
      packages:
        - firefox
        - firefox-langpacks

  # --------------------------------------------------------------------------
  # 3. KERNEL ARGUMENTS
  #
  # Nessun kernel argument aggiuntivo.
  #
  # Non vengono usati:
  #   - rpm-ostree con kernel-args
  #   - kargs
  #   - ryzenadj
  #   - nvme.noacpi=1
  #   - amd_pstate=active
  #   - rcutree.enable_rcu_lazy=1
  #
  # Il BIOS limita gia' l'APU a 10 W.
  # nvme.noacpi=1 viene evitato per non peggiorare il power management NVMe.
  # --------------------------------------------------------------------------

  # --------------------------------------------------------------------------
  # 4. FLATPAK DI SISTEMA E UTENTE
  #
  # Le app elencate vengono installate a livello di sistema.
  # Il blocco user abilita Flathub anche per l'utente, cosi' Discover puo'
  # installare Flatpak utente senza richiedere la password amministrativa.
  # --------------------------------------------------------------------------
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.github.tchx84.Flatseal
          - org.kde.haruna
          - org.kde.kolourpaint

      - scope: user

  # --------------------------------------------------------------------------
  # 5. SERVIZI SYSTEMD
  #
  # system: e' il contenitore corretto per le unita' di sistema.
  # --------------------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - snapper-timeline.timer
        - snapper-cleanup.timer
        - podman.socket

      masked:
        - rpm-ostreed-automatic.timer
        - systemd-oomd.service

  # --------------------------------------------------------------------------
  # 6. FIRMA DELL'IMMAGINE - OPZIONALE
  #
  # Decommentare solo dopo aver configurato nei secret GitHub:
  #
  #   COSIGN_PRIVATE_KEY
  #   COSIGN_PASSWORD
  # --------------------------------------------------------------------------
  # - type: signing
  #   cosign:
  #     private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
  #     password: ${{ secrets.COSIGN_PASSWORD }}
