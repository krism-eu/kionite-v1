# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: mio-aurora-omega
description: "Aurora KDE/Wayland superlight — Ryzen 5 5625U Vega 7, 10 W fanless, Btrfs/Snapper, no gaming, no PIM, no VM/ARM extras"

base-image: ghcr.io/ublue-os/aurora
image-version: stable

modules:
  # ==========================================================================
  # 1. FILE DI SISTEMA
  # ==========================================================================

  - type: files
    files:
      - source: system
        destination: /

  # ==========================================================================
  # 2. PACCHETTI RPM
  # ==========================================================================

  - type: dnf
    repos:
      copr:
        - atim/starship

    install:
      packages:
        # ----------------------------------------------------------------------
        # Btrfs e snapshot
        # ----------------------------------------------------------------------
        - btrfs-assistant
        - snapper

        # ----------------------------------------------------------------------
        # Strumenti CLI moderni
        # ----------------------------------------------------------------------
        - starship
        - micro
        - zoxide
        - bat
        - eza
        - ripgrep
        - fd-find

    remove:
      auto-remove: false

      packages:
        # ----------------------------------------------------------------------
        # ZFS: il sistema usa Btrfs
        # ----------------------------------------------------------------------
        - zfs
        - kmod-zfs
        - libzfs7
        - libzpool7
        - libnvpair3
        - libuutil3
        - python3-pyzfs

        # ----------------------------------------------------------------------
        # Guest tools VM: sistema installato su hardware fisico
        # ----------------------------------------------------------------------
        - virtualbox-guest-additions
        - open-vm-tools
        - open-vm-tools-desktop
        - spice-vdagent
        - spice-webdavd
        - qemu-guest-agent
        - qemu-user-static-aarch64
        - hyperv-daemons
        - hyperv-daemons-license
        - hypervfcopyd
        - hypervkvpd
        - hypervvssd

        # ----------------------------------------------------------------------
        # MariaDB: nessun database locale
        # ----------------------------------------------------------------------
        - mariadb
        - mariadb-server
        - mariadb-backup
        - mariadb-gssapi-server
        - mariadb-cracklib-password-check
        - mysql-selinux

        # ----------------------------------------------------------------------
        # Metodi di input asiatici
        # ----------------------------------------------------------------------
        - fcitx5-chewing
        - fcitx5-chinese-addons
        - fcitx5-chinese-addons-data
        - fcitx5-hangul
        - fcitx5-mozc
        - fcitx5-unikey

        - ibus-anthy
        - ibus-anthy-python
        - ibus-chewing
        - ibus-hangul
        - ibus-libpinyin
        - ibus-m17n
        - ibus-typing-booster

        - kasumi-common
        - kasumi-unicode
        - anthy-unicode
        - libchewing
        - libhangul
        - libpinyin
        - libpinyin-data
        - libime
        - libime-data
        - m17n-db
        - m17n-lib

        # ----------------------------------------------------------------------
        # OCR: lingue non necessarie
        # ----------------------------------------------------------------------
        - tesseract-langpack-chi_sim
        - tesseract-langpack-chi_sim_vert
        - tesseract-langpack-chi_tra
        - tesseract-langpack-chi_tra_vert
        - tesseract-langpack-jpn
        - tesseract-langpack-jpn_vert
        - tesseract-langpack-hin

        # ----------------------------------------------------------------------
        # Accessibilità non utilizzata
        # ----------------------------------------------------------------------
        - braille-printer-app
        - brltty
        - brlapi
        - python3-brlapi
        - espeak-ng
        - speech-dispatcher
        - speech-dispatcher-espeak-ng
        - speech-dispatcher-libs
        - speech-dispatcher-utils
        - orca

        # ----------------------------------------------------------------------
        # Gaming, streaming, VR e periferiche gaming
        # ----------------------------------------------------------------------
        - Sunshine
        - gamemode
        - oversteer-udev
        - kmod-xone
        - xone-kmod-common
        - openxr-libs

        # ----------------------------------------------------------------------
        # VPN non utilizzate
        # ----------------------------------------------------------------------
        - openconnect
        - openvpn
        - vpnc
        - NetworkManager-openconnect
        - NetworkManager-openvpn
        - NetworkManager-vpnc

        # Plugin VPN dell'interfaccia Plasma
        - plasma-nm-openconnect
        - plasma-nm-openvpn
        - plasma-nm-vpnc

        # ----------------------------------------------------------------------
        # Active Directory, LDAP e Kerberos non utilizzati
        # ----------------------------------------------------------------------
        - realmd
        - adcli
        - adcli-selinux
        - krb5-workstation
        - krb5-pkinit
        - sssd-client
        - sssd-common
        - sssd-kcm
        - sssd-krb5-common
        - sssd-nfs-idmap

  # ==========================================================================
  # 3. FLATPAK DI SISTEMA
  # ==========================================================================

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.github.tchx84.Flatseal
          - org.kde.haruna
          - org.kde.kolourpaint

      - notify: false
        scope: user

  # ==========================================================================
  # 4. SERVIZI SYSTEMD
  # ==========================================================================

  - type: systemd
    system:
      enabled:
        - snapper-timeline.timer
        - snapper-cleanup.timer
        - podman.socket

  # ==========================================================================
  # 5. FIRMA DELL'IMMAGINE - OPZIONALE
  # ==========================================================================

  # - type: signing
  #   cosign:
  #     private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
  #     password: ${{ secrets.COSIGN_PASSWORD }}
