# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: mio-kinoite-omega
description: "Fedora Kinoite KDE/Wayland superlight — Ryzen 5 5625U Vega 7, 10 W fanless, Btrfs/Snapper, no gaming, no VM extras"

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # ==========================================================================
  # 1. FILE DI SISTEMA
  # ==========================================================================
  - type: files
    files:
      - source: system
        destination: /

  # ==========================================================================
  # 2. PACCHETTI RPM
  # ==========================================================================
  - type: dnf
    repos:
      copr:
        - atim/starship

    install:
      packages:
        - btrfs-assistant
        - snapper
        - starship
        - micro
        - zoxide
        - bat
        - eza
        - ripgrep
        - fd-find

    remove:
      auto-remove: false
      packages:
        # ----------------------------------------------------------------------
        # Guest tools VM: sistema installato su hardware fisico
        # ----------------------------------------------------------------------
        - virtualbox-guest-additions
        - open-vm-tools
        - open-vm-tools-desktop
        - spice-vdagent
        - spice-webdavd
        - qemu-guest-agent
        - qemu-user-static-aarch64
        - hyperv-daemons
        - hyperv-daemons-license
        - hypervfcopyd
        - hypervkvpd
        - hypervvssd

        # ----------------------------------------------------------------------
        # MariaDB: nessun database locale
        # ----------------------------------------------------------------------
        - mariadb
        - mariadb-server
        - mariadb-backup
        - mariadb-gssapi-server
        - mariadb-cracklib-password-check
        - mysql-selinux

        # ----------------------------------------------------------------------
        # Metodi di input asiatici
        # ----------------------------------------------------------------------
        - ibus-anthy
        - ibus-anthy-python
        - ibus-chewing
        - ibus-hangul
        - ibus-libpinyin
        - ibus-m17n
        - ibus-typing-booster
        - kasumi-common
        - kasumi-unicode
        - anthy-unicode

        # ----------------------------------------------------------------------
        # Accessibilità non utilizzata
        # ----------------------------------------------------------------------
        - braille-printer-app
        - brltty
        - brlapi
        - python3-brlapi
        - orca

        # ----------------------------------------------------------------------
        # Gaming
        # ----------------------------------------------------------------------
        - gamemode

        # ----------------------------------------------------------------------
        # VPN (Rimossi solo i backend, NON tocco i plugin di KDE plasma-nm)
        # ----------------------------------------------------------------------
        - openconnect
        - openvpn
        - vpnc
        - NetworkManager-openconnect
        - NetworkManager-openvpn
        - NetworkManager-vpnc

        # ----------------------------------------------------------------------
        # Active Directory, LDAP e Kerberos non utilizzati
        # ----------------------------------------------------------------------
        - realmd
        - adcli
        - adcli-selinux
        - krb5-workstation
        - krb5-pkinit
        - sssd-client
        - sssd-common
        - sssd-kcm
        - sssd-krb5-common
        - sssd-nfs-idmap

  # ==========================================================================
  # 3. FLATPAK DI SISTEMA
  # ==========================================================================
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.github.tchx84.Flatseal
          - org.kde.haruna
          - org.kde.kolourpaint
      - notify: false
        scope: user

  # ==========================================================================
  # 4. SERVIZI SYSTEMD
  # ==========================================================================
  - type: systemd
    system:
      enabled:
        - snapper-timeline.timer
        - snapper-cleanup.timer
        - podman.socket

  # ==========================================================================
  # 5. FIRMA DELL'IMMAGINE - OPZIONALE
  # ==========================================================================
  # - type: signing
  #   cosign:
  #     private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
  #     password: ${{ secrets.COSIGN_PASSWORD }}
