# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: kinoite-base-main-v1
description: "Fedora KDE/Wayland superlight from base-main — Ryzen 5 5625U / Vega 7, fanless, Btrfs/Snapper"

base-image: ghcr.io/ublue-os/base-main
image-version: "44"

modules:
  # ==========================================================================
  # 1. FILE DI SISTEMA
  # ==========================================================================
  - type: files
    files:
      - source: system
        destination: /

  # ==========================================================================
  # 2. PACCHETTI BASE, AUDIO E PLASMA
  # ==========================================================================
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # Lingue minime
        - glibc-langpack-en
        - glibc-langpack-it

        # Storage e sistema
        - snapper
        - btrfs-assistant
        - btrfsmaintenance
        - rclone

        # Audio moderno: PipeWire + WirePlumber.
        # pipewire-pulseaudio offre compatibilità PulseAudio tramite PipeWire.
        - pipewire
        - pipewire-alsa
        - pipewire-pulseaudio
        - wireplumber
        - mt7xxx-firmware

        # KDE / Plasma
        - plasma-desktop
        - plasma-workspace
        - kscreen
        - powerdevil
        - plasma-nm
        - plasma-pa
        - plasma-systemmonitor
        - plasma-discover
        - plasma-discover-flatpak
        - plasma-print-manager
        - kde-connect
        - kde-gtk-config
        - kdeplasma-addons
        - bluedevil
        - kde-settings
        - kde-settings-plasma
        - kwalletmanager5
        - kio-fuse
        - kdegraphics-thumbnailers

        # Plasma Login Manager
        - plasma-login-manager
        - kcm-plasmalogin
        - kde-settings-plasmalogin

        # Portali e compatibilità X11 per applicazioni legacy
        - xdg-desktop-portal-kde
        - xorg-x11-server-Xwayland

        # Applicazioni KDE
        - dolphin
        - dolphin-plugins
        - kate
        - kwrite
        - konsole
        - ark
        - gwenview
        - spectacle
        - okular
        - kfind
        - filelight
        - kinfocenter
        - kio-admin
        - kde-partitionmanager

        # Strumenti CLI
        - btop
        - fastfetch
        - fish
        - openssh-server

        # Sfondi
        - f44-backgrounds-base
        - f44-backgrounds-kde

  # ==========================================================================
  # 3. RIMOZIONI BASE: VM, INPUT, ACCESSIBILITÀ, GAMING, VPN, NFS
  # ==========================================================================
  - type: dnf
    remove:
      auto-remove: false
      packages:
        - kde-settings-pulseaudio
        - pulseaudio

        # Guest tools VM
        - virtualbox-guest-additions
        - open-vm-tools
        - open-vm-tools-desktop
        - spice-vdagent
        - spice-webdavd
        - qemu-guest-agent
        - qemu-user-static-aarch64
        - hyperv-daemons
        - hyperv-daemons-license
        - hypervfcopyd
        - hypervkvpd
        - hypervvssd

        # Metodi di input asiatici IBus
        - ibus-anthy
        - ibus-anthy-python
        - ibus-chewing
        - ibus-hangul
        - ibus-libpinyin
        - ibus-m17n
        - ibus-typing-booster
        - kasumi-common
        - kasumi-unicode
        - anthy-unicode

        # Accessibilità non utilizzata
        - braille-printer-app
        - brltty
        - brlapi
        - python3-brlapi
        - orca

        # Gaming e periferiche non utilizzate
        - gamemode
        - solaar-udev

        # Backend VPN
        - openconnect
        - openvpn
        - vpnc
        - NetworkManager-openconnect
        - NetworkManager-openvpn
        - NetworkManager-vpnc

        # Identity enterprise, NFS e RPC
        - sssd-client
        - sssd-common
        - sssd-kcm
        - sssd-krb5-common
        - sssd-nfs-idmap
        - realmd
        - nfs-client-utils
        - nfs-common-utils
        - nfsv3-client-utils
        - nfsv4-client-utils
        - nfs-utils
        - libnfsidmap
        - rpcbind
        - gssproxy

  # ==========================================================================
  # 4. RIMOZIONI STRUMENTI E COMPONENTI OPZIONALI
  # ==========================================================================
  - type: dnf
    remove:
      auto-remove: false
      packages:
        # Firma/build, debug e tool ridondanti
        - cosign
        - gdb
        - gdb-headless
        - vim-enhanced
        - vim-common
        - vim-data
        - vim-filesystem
        - xxd
        - nvtop
        - htop
        - hwloc-libs
        - mcelog
        - gpm-libs

        # Firmware GPU NVIDIA: hardware AMD.
        - nvidia-gpu-firmware

        # Driver HP e altri driver stampanti non Epson.
        # CUPS resta installato.
        - hplip
        - hplip-common
        - hplip-libs
        - printer-driver-brlaser
        - ptouch-driver

        # Desktop remoto KDE e moduli KDE non usati
        - krfb
        - krfb-libs
        - krdp
        - khelpcenter
        - plasma-welcome
        - kdebugsettings
        - plasma-thunderbolt

        # Fingerprint
        - fprintd
        - fprintd-pam

        # SMART / monitoraggio hardware non desiderato
        - smartmontools
        - smartmontools-selinux

  # ==========================================================================
  # 5. RIMOZIONI MODEM, INTEL E SMARTCARD
  # ==========================================================================
  - type: dnf
    remove:
      auto-remove: false
      packages:
        # Non rimuovere ModemManager: mantenerlo evita rimozioni a cascata
        # di componenti NetworkManager non ancora validate.
        - fwupd-plugin-modem-manager
        - kunifiedpush
        - mobile-broadband-provider-info
        - qcom-wwan-firmware
        - usbmodeswitch
        - usbmodeswitch-data

        # mt7xxx-firmware NON va rimosso: serve al Wi-Fi/Bluetooth MediaTek.

        # Hardware AMD: stack Intel GPU/media non necessario.
        - intel-gmmlib
        - intel-gpu-firmware
        - intel-lpmd
        - intel-mediasdk
        - intel-vaapi-driver
        - intel-vpl-gpu-rt
        - intel-vsc-firmware
        - libva-intel-media-driver

        # Smartcard e YubiKey. pcsc-lite resta deliberatamente fuori.
        - libpskc
        - libyubikey
        - opensc
        - opensc-libs
        - pam-u2f
        - pam_yubico
        - pamu2fcfg
        - pcsc-lite-ccid
        - python3-fido2
        - python3-pskc
        - python3-pyscard
        - python3-yubikey-manager
        - ykclient
        - ykpers
        - yubikey-manager

  # ==========================================================================
  # 6. RIMOZIONI KDE, VLC, FONT E FIREFOX
  # ==========================================================================
  - type: dnf
    remove:
      auto-remove: false
      packages:
        - kio-gdrive
        - libkgapi

        # VLC e backend Phonon VLC
        - phonon-backend-vlc-common
        - phonon-qt5-backend-vlc
        - phonon-qt6-backend-vlc
        - vlc-libs
        - vlc-plugin-ffmpeg
        - vlc-plugin-gstreamer
        - vlc-plugin-pipewire
        - vlc-plugin-pulseaudio
        - vlc-plugins-base
        - vlc-plugins-video-out

        # Font linguistici non necessari
        - default-fonts-am
        - default-fonts-ar
        - default-fonts-as
        - default-fonts-ast
        - default-fonts-be
        - default-fonts-bg
        - default-fonts-bn
        - default-fonts-bo
        - default-fonts-br
        - default-fonts-chr
        - default-fonts-dv
        - default-fonts-dz
        - default-fonts-el
        - default-fonts-eo
        - default-fonts-eu
        - default-fonts-fa
        - default-fonts-got
        - default-fonts-gu
        - default-fonts-he
        - default-fonts-hi
        - default-fonts-hy
        - default-fonts-ia
        - default-fonts-ii
        - default-fonts-iu
        - default-fonts-ka
        - default-fonts-kab
        - default-fonts-km
        - default-fonts-kn
        - default-fonts-ku
        - default-fonts-lo
        - default-fonts-mai
        - default-fonts-ml
        - default-fonts-mni
        - default-fonts-mr
        - default-fonts-my
        - default-fonts-nb
        - default-fonts-ne
        - default-fonts-nn
        - default-fonts-nqo
        - default-fonts-nr
        - default-fonts-nso
        - default-fonts-or
        - default-fonts-other-sans
        - default-fonts-other-serif
        - default-fonts-pa
        - default-fonts-ru
        - default-fonts-sat
        - default-fonts-si
        - default-fonts-ss
        - default-fonts-syr
        - default-fonts-ta
        - default-fonts-te
        - default-fonts-th
        - default-fonts-tn
        - default-fonts-ts
        - default-fonts-uk
        - default-fonts-ur
        - default-fonts-ve
        - default-fonts-vi
        - default-fonts-xh
        - default-fonts-yi
        - default-fonts-zu
        - jomolhari-fonts
        - madan-fonts
        - paktype-naskh-basic-fonts
        - rit-meera-new-fonts
        - rit-rachana-fonts
        - sil-padauk-fonts
        - vazirmatn-vf-fonts

        # Font CJK
        - default-fonts-cjk-mono
        - default-fonts-cjk-serif
        - google-noto-sans-cjk-fonts
        - google-noto-sans-mono-cjk-vf-fonts
        - google-noto-serif-cjk-vf-fonts

        # Firefox RPM: usare Flatpak se desiderato.
        - firefox
        - firefox-langpacks

        - cldr-emoji-annotation
        - cldr-emoji-annotation-dtd
        - xdriinfo
        - fedora-bookmarks
        - fedora-chromium-config
        - fedora-chromium-config-kde
        - fedora-workstation-backgrounds
        - glibc-all-langpacks

  # ==========================================================================
  # 7. RIMOZIONE INPUT METHOD FCITX5
  # ==========================================================================
  - type: dnf
    remove:
      auto-remove: false
      packages:
        - fcitx5
        - fcitx5-configtool
        - fcitx5-data
        - fcitx5-gtk
        - fcitx5-gtk3
        - fcitx5-gtk4
        - fcitx5-libs
        - fcitx5-lua
        - fcitx5-qt
        - fcitx5-qt5
        - fcitx5-qt6
        - fcitx5-qt-libfcitx5qt6widgets
        - fcitx5-qt-libfcitx5qtdbus
        - fcitx5-qt-qt6gui
        - kcm-fcitx5
        - fcitx5-chewing
        - fcitx5-chinese-addons
        - fcitx5-chinese-addons-data
        - fcitx5-hangul
        - fcitx5-libthai
        - fcitx5-m17n
        - fcitx5-mozc
        - fcitx5-sayura
        - fcitx5-unikey
        - libchewing
        - libhangul
        - libime
        - libime-data
        - libpinyin
        - libpinyin-data
        - m17n-db
        - m17n-db-devel
        - m17n-lib
        - opencc

  # ==========================================================================
  # 8. RIMOZIONI VARIE
  # ==========================================================================
  - type: dnf
    remove:
      auto-remove: false
      packages:
        - solaar-udev
        - gpm-libs
        - gssproxy

  # ==========================================================================
  # 8.5. PULIZIA AUTHSELECT / FINGERPRINT
  # ==========================================================================
  - type: script
    snippets:
      - |
        set -eu

        if command -v authselect >/dev/null 2>&1 \
          && authselect current -r 2>/dev/null | grep -qw with-fingerprint; then
          authselect disable-feature with-fingerprint
          authselect apply-changes
        fi

        if rpm -q fprintd fprintd-pam >/dev/null 2>&1; then
          echo "fprintd o fprintd-pam è ancora installato" >&2
          exit 1
        fi

        if grep -Rqs 'pam_fprintd\.so' /etc/pam.d 2>/dev/null; then
          echo "Riferimento PAM residuo a pam_fprintd.so" >&2
          grep -Rns 'pam_fprintd\.so' /etc/pam.d || true
          exit 1
        fi

  # ==========================================================================
  # 9. FLATPAK DI SISTEMA
  # ==========================================================================
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
      - notify: false
        scope: user

  # ==========================================================================
  # 10. PULIZIA DNF E TARGET GRAFICO
  # ==========================================================================
  - type: script
    snippets:
      - |
        set -eu
        dnf clean all
        rm -rf /var/cache/dnf
        systemctl set-default graphical.target

  # ==========================================================================
  # 11. SERVIZI SYSTEMD
  # ==========================================================================
  - type: systemd
    system:
      enabled:
        - plasmalogin.service
      disabled:
        - NetworkManager-wait-online.service
        - fedora-atomic-desktop-mandb-update.service
        - fedora-atomic-desktop-appstream-cache-refresh.service
        - flatpak-system-update.timer
        - systemd-homed.service
        - systemd-homed-activate.service
        - ModemManager.service
        - sshd.service
      masked:
        - foomaticrip-upgrade.service

# Non abilitare fedora-kinoite-plasmalogin-workaround.service.
# È un workaround specifico Kinoite/OSTree e non va copiato in una base-main.

# ==========================================================================
# 12. FIRMA DELL'IMMAGINE — OPZIONALE
# ==========================================================================
# - type: signing
#   cosign:
